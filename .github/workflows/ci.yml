name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ em dia com src/
        run: npm run check:dist

  # Static analysis of this repo's workflows. Plain output and annotations, no SARIF upload, so it
  # needs no code scanning; any finding fails the job.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.32.0

  # End-to-end test of seguranca.yml on this repo's own PRs and pushes, warn-only. It runs the bundle
  # from the commit under test (ci-ref), not from the v1 tag. `./` and not the self-repository `$/`:
  # actionlint, one of this repo's checks, does not accept `$/` yet.
  seguranca:
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/seguranca.yml # zizmor: ignore[self-repository]
    with:
      ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}
